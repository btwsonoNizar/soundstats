<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Statistiche dei tuoi ascolti Spotify, calcolate sul telefono dai dati che hai scaricato.">
  <meta property="og:title" content="SoundStats – statistiche di ascolto">
  <meta property="og:description" content="Classifiche per minuti effettivi di brani, artisti, album e podcast. I dati restano sul tuo dispositivo.">
  <meta property="og:image" content="icons/icon-512.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SoundStats">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <title>SoundStats</title>
</head>
<body>
  <header class="top">
    <button id="backBtn" class="icon-btn" aria-label="Indietro" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg>
    </button>
    <h1 id="title">SoundStats</h1>
    <button id="filterBtn" class="chip" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h2v2h6V2h2v2h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3zm12 8H5v9h14z"/></svg>
      <span></span>
    </button>
    <button id="profileBtn" class="avatar-btn" aria-label="Profilo, dati e impostazioni"></button>
  </header>

  <main id="view"></main>

  <nav class="tabs" hidden>
    <div class="tabs-brand"><img src="icons/icon.svg" alt="" width="28" height="28">SoundStats</div>
    <a href="#/overview" data-tab="overview">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4v7H4zm6-9h4v16h-4zm6 5h4v11h-4z"/></svg>
      <span>Panoramica</span>
    </a>
    <a href="#/tracks" data-tab="tracks">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h11v12.5a3.5 3.5 0 1 1-2-3.2V8h-7v10.5a3.5 3.5 0 1 1-2-3.2z"/></svg>
      <span>Brani</span>
    </a>
    <a href="#/artists" data-tab="artists">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 11c4.4 0 8 2.2 8 5v2H4v-2c0-2.8 3.6-5 8-5z"/></svg>
      <span>Artisti</span>
    </a>
    <a href="#/albums" data-tab="albums">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 2a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>
      <span>Album</span>
    </a>
    <a href="#/podcasts" data-tab="podcasts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a4 4 0 0 1 4 4v5a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4zm-7 9h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.9V21h-2v-3.1A7 7 0 0 1 5 11z"/></svg>
      <span>Podcast</span>
    </a>
    <a href="#/today" data-tab="today" class="tabs-extra tabs-recap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm1 3v4.6l3.4 3.4-1.4 1.4-4-4V7z"/></svg>
      <span>Oggi</span>
    </a>
    <a href="#/recap" data-tab="recap" class="tabs-extra tabs-recap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v10l3.5-3.5 3 3 4-4L19 14V5zm4 1.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg>
      <span>Recap</span>
    </a>
    <a href="#/profile" data-tab="profile" class="tabs-extra">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 4a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm0 9c-2.4 0-4.5 1-5.6 2.6A8 8 0 0 0 12 20a8 8 0 0 0 5.6-2.4C16.5 16 14.4 15 12 15z"/></svg>
      <span>Profilo</span>
    </a>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="busy" class="busy" hidden><div class="spinner"></div><p id="busyText"></p></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <input type="file" id="fileInput" multiple hidden>

  <script src="js/config.js"></script>
  <script src="js/spotify.js"></script>
  <script src="js/images.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/recap.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
